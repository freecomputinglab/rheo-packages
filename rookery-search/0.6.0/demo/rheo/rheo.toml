# @rheo/rookery-search's only in-repo rheo fixture. Until this existed the
# package was the one here whose rheo path had NO demo — it shipped src/, dist/
# and test/, and its Justfile never invoked rheo at all — while this repo's own
# definition of lint is "the package builds and its demo compiles".
#
# The corpus is seeded from `@rheo/rookery`'s own demo, deliberately: what this
# fixture has to exercise is a REAL rookery under rheo, with minted pages and
# notes at two spine depths, because the depth-relative asset prefix and the
# per-note index rows are precisely what a root-only page cannot catch.
version = "0.5.2"
content_dir = "content"
formats = ["html"]

# `lib.typ` is a library, not a page: it holds the named `idea-page` function
# and the one `#show: rookery.with(..)` both vertebrae apply. Without this it
# would compile to its own `lib.html`.
[spine]
exclude = ["lib.typ"]
