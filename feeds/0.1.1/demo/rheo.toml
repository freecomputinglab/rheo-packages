# Exercises @rheo/feeds's headline capability: a spine-filtered feed of
# posts (feed.xml), with each entry's full page content transcluded in. See
# content/index.typ for the one `configure(...)` call, and for where a
# second feed sourced from @rookery/core's `ideas(tags:)` used to live.
#
# Needs an UNRELEASED rheo (>= 0.6.0, currently the feat/transclusion line):
# `<rheo-content>` transclusion and `.rheo/` control assets (the
# autodiscovery `<link>` this package mints) do not exist in 0.5.2. See this
# package's readme, "## Demo".
version = "0.6.0"
content_dir = "content"
formats = ["html"]
