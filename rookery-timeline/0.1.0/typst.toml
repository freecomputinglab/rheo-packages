[package]
name = "rookery-timeline"
version = "0.1.0"
compiler = "0.15.0"
entrypoint = "src/lib.typ"
authors = ["The Free Computing Lab <https://freecomputinglab.ohrg.org>"]
license = "MIT"
description = "A dated lifecycle log for @rheo/rookery notes — stages, ladders and a rail that draws them"
repository = "https://github.com/freecomputinglab/rheo-packages"

# The floor @rheo/rookery 0.5.0 declares, matched rather than guessed: this
# package contributes tag metadata to rookery notes, so a project using it is
# already on a rheo that can build rookery. Nothing here reads rheo context
# directly — see `src/lib.typ`'s header — so the floor is inherited, not owned.
#
# THIS TABLE MUST STAY LAST, and `[tool.rheo.html]` below is exactly the hazard the
# rule guards: a `[tool.rheo.<format>]` subtable placed AFTER `min_version` would
# capture that key into the subtable instead. So `min_version` sits directly under
# `[tool.rheo]` and every subtable follows it.
#
# THIS PACKAGE SHIPS A STYLESHEET as of the `#timeline-view` work. It used to say here
# that it emits no HTML and ships no CSS or JS; that was true of every function it
# had, and `#timeline-view` is the one that draws something — a vertical rail of a
# note's dated log, which is not usable unstyled. There is still no JavaScript.
[tool.rheo]
min_version = "0.6.0"

[tool.rheo.html]
css_stylesheet = "src/rookery-timeline.css"
