name: Publish Packages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build and release new package versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          while IFS= read -r manifest; do
            dir=$(dirname "$manifest")
            name=$(grep '^name = ' "$manifest" | sed 's/name = "\(.*\)"/\1/')
            version=$(grep '^version = ' "$manifest" | sed 's/version = "\(.*\)"/\1/')
            tag="${name}-${version}"

            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" &>/dev/null 2>&1; then
              echo "skip: $tag already released"
              continue
            fi

            echo "build: $name $version"
            (cd "$dir" && pnpm install --frozen-lockfile && pnpm run build)

            archive="${tag}.tar.gz"
            tar -czf "$archive" -C "$dir" typst.toml dist/

            gh release create "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$name $version" \
              --notes "Typst package \`@rheo/$name:$version\`" \
              "${archive}#${archive}"

            rm "$archive"

          done < <(find . -name typst.toml -not -path './.git/*' | sort)
