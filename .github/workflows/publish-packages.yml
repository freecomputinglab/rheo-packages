name: Publish Packages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5
        with:
          version: latest

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - uses: extractions/setup-just@v3

      - name: Build and release new package versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          while IFS= read -r manifest; do
            dir=$(dirname "$manifest")
            name=$(grep '^name = ' "$manifest" | sed 's/name = "\(.*\)"/\1/')
            version=$(grep '^version = ' "$manifest" | sed 's/version = "\(.*\)"/\1/')
            tag="${name}-${version}"

            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" &>/dev/null 2>&1; then
              echo "skip: $tag already released"
              continue
            fi

            echo "build: $name $version"
            if [ -f "$dir/package.json" ]; then
              (cd "$dir" && pnpm install --frozen-lockfile && pnpm run build)
            elif grep -qE '^build:' "$dir/Justfile" 2>/dev/null; then
              (cd "$dir" && just build)
            else
              echo "no build step for $name — entrypoint ships straight from src/"
            fi

            # A JS package, or a pure-Typst one with its own `build` recipe,
            # produces dist/; a dist-less pure-Typst package (no package.json,
            # no `build` recipe) has its manifest entrypoint pointing straight
            # at src/ instead — ship whichever actually exists.
            archive="${tag}.tar.gz"
            if [ -d "$dir/dist" ]; then
              tar -czf "$archive" -C "$dir" typst.toml dist/
            else
              tar -czf "$archive" -C "$dir" typst.toml src/
            fi

            gh release create "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$name $version" \
              --notes "Typst package \`@rheo/$name:$version\`" \
              "${archive}#${archive}"

            rm "$archive"

          done < <(find . -name typst.toml -not -path './.git/*' | sort)
