# Tests and lints. Deliberately NOT folded into publish-packages.yml: a release
# run must not be gated on a demo build, and a pull request needs these checks
# before merge, where the publish workflow only runs on push to main.
name: Check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5
        with:
          version: latest

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - uses: extractions/setup-just@v3

      # Pinned to the version this repo is developed against, and the one both
      # rookery manifests declare as their `compiler` floor (0.15.0). Installed
      # from the release tarball rather than a third-party action: one pinned URL
      # is easier to audit than an action's own moving parts.
      - name: Install Typst 0.15.1
        run: |
          set -euo pipefail
          curl -fsSL -o typst.tar.xz \
            https://github.com/typst/typst/releases/download/v0.15.1/typst-x86_64-unknown-linux-musl.tar.xz
          tar -xJf typst.tar.xz
          echo "$PWD/typst-x86_64-unknown-linux-musl" >> "$GITHUB_PATH"

      # Pinned to the OLDEST rheo the rookery manifests under test declare as their
      # floor, NOT to the newest rheo: the point is that the DECLARED floor is the
      # floor actually tested, so a package that reaches for a newer surface fails
      # here instead of on a user's machine. Nothing in rheo reads `min_version`
      # yet, so this step is the only thing enforcing it.
      #
      # THE FLOOR MOVED to 0.6.0, and this is not the "bump it to whatever just
      # shipped" that the previous version of this comment forbade. rookery 0.5.0
      # declares `[tool.rheo] min_version = "0.6.0"` because it REQUIRES a 0.6.0
      # surface: `_resolve-dest` (rookery/0.6.0/src/urls.typ) emits a reserved
      # `rheo-page:<handle>` link dest, and only rheo 0.6.0 rewrites it into a
      # depth-correct href. Under 0.5.2 the dest passes straight through and every
      # page ships a literal `href="rheo-page:ideas:<slug>"`, which is what
      # `rookery/0.6.0/demo/rheo/check.sh` catches. Following a floor that moved is
      # still testing the floor; head-of-line coverage would be a second matrix
      # entry, and still is not a replacement for this.
      #
      # The older rookery and rookery-search directories remain in the tree and
      # still declare their own floors. They are NOT exercised here — that is the second matrix entry, not
      # this step.
      #
      # Pinned URL AND pinned digest, for the same auditability reason the Typst
      # step gives: a re-uploaded asset fails this step rather than silently
      # changing what CI tested.
      - name: Install rheo 0.6.0 (the declared min_version floor)
        run: |
          set -euo pipefail
          # Digest of the v0.6.0 rheo-x86_64-unknown-linux-gnu.zip asset, published
          # 2026-08-24. Read back with:
          #   gh release view v0.6.0 --repo freecomputinglab/rheo --json assets
          # BUMP THIS IN THE SAME EDIT AS THE URL BELOW: the `sha256sum -c` is what
          # makes a re-uploaded or wrong-version asset fail here rather than silently
          # changing what CI tested.
          sha256="05c40231acaaf58fd0e3cba0b40e1c1d1a939bfe6bea8e775868dbf6f9c79d7f"
          curl -fsSL -o rheo.zip \
            https://github.com/freecomputinglab/rheo/releases/download/v0.6.0/rheo-x86_64-unknown-linux-gnu.zip
          echo "$sha256  rheo.zip" | sha256sum -c -
          unzip -q rheo.zip -d rheo-bin
          chmod +x rheo-bin/rheo
          echo "$PWD/rheo-bin" >> "$GITHUB_PATH"
          rheo-bin/rheo --version   # must print: rheo 0.6.0

      # First, because it is the cheapest failure in the repo and the one that
      # silently ships a broken release: a version directory cut by copying and
      # bumping only the manifest leaves `.marrow.typ` importing its predecessor.
      - name: Package specs agree with their manifests
        run: just check-versions

      - name: rookery unit fixture
        run: cd rookery/0.6.0 && just test

      # BEFORE the namespace-symlink step, and that is not an accident:
      # @rheo/rookery-dates imports no other package by spec — it builds tag
      # fragments, which are plain dictionaries — so it needs neither the cache
      # nor a build. It is also buildless, like rookery itself.
      - name: rookery-dates unit fixture
        run: cd rookery-dates/0.5.0 && just test

      # `@rheo` IS A CUSTOM NAMESPACE, NOT A TYPST-UNIVERSE ONE, so there is no
      # registry to download it from: it resolves only where the package cache
      # already holds it. `rookery-search/0.5.0/src/lib.typ` imports
      # `@rheo/rookery:0.5.0` for `ideas` and `note-href`, and `just parity` compiles
      # that file through `typst eval` — so without this the next step dies with
      # `error: package not found (searched for @rheo/rookery:0.5.0)`. MEASURED by
      # running `just parity` under a scratch HOME with no namespace: three such
      # errors, then green the moment the link exists.
      #
      # THE WHOLE NAMESPACE, not one package, and this is the same one-line setup
      # CLAUDE.md prescribes for a developer's machine. Linking a single package in
      # is the documented mistake: under a namespace link the target resolves back
      # into the repo, where `<pkg>/` already exists, and `ln -sfn TARGET DIR` then
      # writes the link INSIDE it, leaving a self-referential `<pkg>/<pkg>`.
      #
      # Only `rookery-search` needs it. `rookery`'s own fixture imports
      # `/src/lib.typ` and `demo/pure` imports `../../src/lib.typ`, both by path —
      # which is why those two steps have always passed while this one could not.
      - name: Resolve the @rheo namespace from this checkout
        run: |
          set -euo pipefail
          cache="${XDG_CACHE_HOME:-$HOME/.cache}/typst/packages"
          mkdir -p "$cache"
          ln -s "$PWD" "$cache/rheo"
          # Fail HERE with something legible rather than inside a typst error later.
          test -f "$cache/rheo/rookery-search/0.5.0/typst.toml"

      # `just parity` is the only thing keeping the Typst and JavaScript copies
      # of the ranking rule from drifting — two leaf scorers and the tiering rule
      # above them. `just build` first: parity imports `src/`, but a build failure
      # is worth catching here too, since publish-packages.yml only builds on main.
      - name: rookery-search build and parity
        run: cd rookery-search/0.5.0 && just build && just parity

      # This repo's definition of "lint" is that a package's demo compiles
      # (CLAUDE.md, "Build"). `demo/pure` is plain `typst compile`, so it runs
      # anywhere.
      # `just build`, not a hand-copied subset of its `typst compile` lines: that
      # subset drifted before (it ran only root.typ->html and paged.typ->pdf while
      # the Justfile's own `build` recipe had grown to six compiles across three
      # roots. Running the recipe directly means a
      # new root added to the Justfile is gated in CI automatically instead of
      # needing this step updated in the same commit and possibly forgotten.
      - name: rookery pure demo compiles, HTML and PDF
        run: cd rookery/0.6.0/demo/pure && just build

      # The rheo half of rookery's coverage, and the only thing that proves
      # package-`.marrow.typ` still mints: `check.sh` asserts on the OUTPUT —
      # minted note pages, backlinks, depth-relative hrefs, and the generated
      # `@layer rookery-tags` rules — none of which `demo/pure` can reach.
      #
      # AFTER the namespace-symlink step above, not before: the demo's
      # `.marrow.typ` needs `@rheo/rookery:0.5.0` to resolve from the cache.
      #
      # This ran nowhere until rheo 0.5.2 shipped package-marrow support (PR #164,
      # released 2026-08-16). MEASURED at that release: `demo/rheo OK`, all eight
      # blocks.
      - name: rookery rheo demo compiles and asserts, under the declared floor
        run: cd rookery/0.6.0/demo/rheo && just check

      # rookery-search's own rheo fixture, and the reason it exists: until it did,
      # this was the one package here whose rheo path had NO demo — it shipped
      # `src/`, `dist/` and `test/`, and its Justfile never invoked rheo at all,
      # while this repo's definition of lint is that a package's demo compiles.
      #
      # Its `check.sh` asserts what neither the `node --test` suite nor the parity
      # harness can see: that rheo copied `dist/lib.js` and
      # `dist/rookery-search.css` into the output, that BOTH are linked from every
      # page at the right depth-relative prefix (`rheo/...` at the root,
      # `../rheo/...` one level down), that the JSON island parses with one row per
      # note, and that every href in it resolves to a file on disk.
      #
      # AFTER the namespace-symlink step, like rookery's own — and after the
      # `rookery-search build and parity` step above, because `dist/` is gitignored
      # and rheo cannot resolve the package until vite has written it.
      - name: rookery-search rheo demo compiles and asserts
        run: cd rookery-search/0.5.0/demo/rheo && just check

      # @rheo/rookery-todos needs three things in this order, which is why it
      # sits here rather than beside the unit fixtures above:
      #   - it is a BUILT package (`typst.toml` points at `dist/`, gitignored),
      #     so vite has to run before rheo can resolve it at all;
      #   - it hard-imports BOTH `@rheo/rookery:0.5.0` and
      #     `@rheo/rookery-dates:0.5.0`, so it must follow the namespace symlink;
      #   - `just test-js` covers the graph layout, which is the half of this
      #     package the Typst fixture cannot reach.
      - name: rookery-todos build, unit fixture and graph tests
        run: cd rookery-todos/0.5.0 && just build && just test && just test-js

      # `just check` builds the demo and then asserts on its OUTPUT. The one
      # assertion it exists for is the `.todo-search-row[hidden]` CSS rule:
      # without it `#todos-search` sets `hidden` on every non-matching row and
      # the stylesheet un-hides all of them, so the filter reorders the list and
      # removes nothing. That compiles clean, passes the unit and JS suites, and
      # looks correct in the markup — it is only wrong on screen.
      - name: rookery-todos rheo demo compiles and asserts
        run: cd rookery-todos/0.5.0 && just check

      # @rheo/feeds, gated at last. This step did not exist through 0.1.0 and the
      # workflow carried a comment saying why: the package declares
      # `[tool.rheo] min_version = "0.6.0"` and rides three surfaces (the
      # `<rheo-meta:>` beacon, `<rheo-content>` transclusion, `.rheo/` control
      # assets) that no rheo RELEASE carried, so there was nothing to install.
      # v0.6.0 shipped on 2026-08-24 and the install step above now pins it, so
      # the blocker is gone.
      #
      # THREE RECIPES, because each covers something the others cannot:
      #   - `just test` is plain `typst compile` with no rheo at all, and proves
      #     Pattern B — a project without rheo must be a clean no-op, not a
      #     guard tripping.
      #   - `just check` builds the demo and asserts on the OUTPUT: both feeds'
      #     entry sets, the autodiscovery links in every page's head, the
      #     minted-note content, and each entry's `xml:base`.
      #   - `just verify` runs the fixture matrix `check` cannot host, including
      #     the rows that are SUPPOSED to fail (a feed with no title) and a
      #     project that imports the package but never configures a feed.
      #
      # AFTER the namespace-symlink step: the demo imports `@rheo/rookery:0.5.0`
      # for `ideas()`, which is the whole point of its second feed.
      # @rheo/sidebar's rheo demo. It had no in-repo coverage of any kind until
      # 0.1.1 — no demo, no tests, no readme — which mattered little while the
      # nav was a hand-authored array the package merely rendered. It matters
      # now: as of 0.1.1 the nav and the active page are DERIVED from the spine
      # and the per-page handle, the demo's template passes neither, and a
      # regression in either derivation compiles clean and ships a site whose
      # navigation is empty or whose every link 404s one directory down.
      #
      # `just check` builds `dist/` first (gitignored) and then the demo.
      # AFTER the namespace-symlink step, like every other demo here.
      - name: sidebar builds and its rheo demo asserts
        run: cd sidebar/0.1.1 && just check

      - name: feeds unit fixture, demo assertions and verify matrix
        run: cd feeds/0.1.1 && just test && just check && just verify
