# Bead rheo-packages-parity-qrd, row 4: `title` is REQUIRED — no fallback
# chain (the retired Rust generator fell back to the HTML spine title, then
# the project directory name; @rheo/rssfeed fails the build instead). This
# project's only content omits `title` from its one `feed(...)` call, so the
# build must fail with the package's own assert message. See ../run.sh.
#
# Needs an UNRELEASED rheo (>= 0.6.0, currently the feat/transclusion line) —
# same requirement as ../../demo, see that project's rheo.toml/readme.md.
version = "0.6.0"
content_dir = "content"
formats = ["html"]
