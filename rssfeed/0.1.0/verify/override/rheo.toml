# Bead rheo-packages-parity-qrd, rows 2, 11, 12:
#   - row 2: no `author:` on this project's one `feed(...)` call — must emit
#     the default `<author><name>Rheo</name></author>`.
#   - row 11: `<published>` distinct from `<updated>` (and omitted when an
#     entry carries only `updated`).
#   - row 12: per-entry overrides composed over the built-in `spine()` source,
#     with NO `#set document` involved and no rssfeed-side "current page"
#     variable — the replacement for the retired `rheo-feed-title`/
#     `rheo-feed-updated` variables. See content/index.typ's `configure(...)`
#     call, and ../run.sh for the assertions.
#
# Needs an UNRELEASED rheo (>= 0.6.0, currently the feat/transclusion line) —
# same requirement as ../../demo, see that project's rheo.toml/readme.md.
version = "0.6.0"
content_dir = "content"
formats = ["html"]
